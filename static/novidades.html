<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novidades do Nitzap</title>
    <meta name="description" content="Tudo que mudou no Nitzap, versão por versão.">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --bg-soft: #f5f8f7;
            --bg-bar: rgba(255, 255, 255, 0.94);
            --border: #e2e8e6;
            --text: #17211f;
            --text-body: #2c3836;
            --text-muted: #62716e;
            --accent: #056764;
            --accent-strong: #04514e;
            --accent-soft: #e4f3f0;
            --green-soft: rgba(37, 211, 102, 0.16);
            --inline-code-bg: #edf2f0;
            --code-bg: #111c1b;
            --code-text: #e4efec;
            --image-shadow: 0 10px 28px -18px rgba(13, 43, 40, 0.45);
            --topbar-height: 60px;
            --nav-width: 240px;
            --column-gap: 48px;
        }

        * { box-sizing: border-box; }

        [hidden] { display: none !important; }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: var(--topbar-height);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg-bar);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .topbar-inner {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 24px;
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand {
            flex: none;
            width: calc(var(--nav-width) + var(--column-gap) - 16px);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            text-decoration: none;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, #25d366, #0a8f7a);
            color: #ffffff;
            box-shadow: 0 6px 14px -6px rgba(37, 211, 102, 0.7);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-tag {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 1px 8px;
        }

        .search {
            flex: 0 1 420px;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 7px 12px;
            color: var(--text-muted);
        }

        .search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search svg { flex: none; }

        .search input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        .search input::placeholder { color: var(--text-muted); }

        .topbar-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .topbar-links a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .topbar-links a:hover { color: var(--text); }

        .layout {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: var(--nav-width) minmax(0, 1fr);
            column-gap: var(--column-gap);
            align-items: start;
        }

        .versions {
            position: sticky;
            top: var(--topbar-height);
            max-height: calc(100vh - var(--topbar-height));
            overflow-y: auto;
            padding: 32px 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 2px;
        }

        .versions-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            padding: 0 10px 8px;
        }

        .versions a {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 7px;
            color: var(--text-body);
            text-decoration: none;
            font-size: 14.5px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .versions a:hover { background: var(--bg-soft); }

        .versions a.active {
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-weight: 600;
        }

        .versions a span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .versions a small {
            flex: none;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .content {
            min-width: 0;
            max-width: 780px;
            padding: 32px 0 56px;
        }

        .page-title {
            margin: 0;
            font-size: clamp(1.75rem, 3vw, 2.15rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        .lead {
            margin: 12px 0 0;
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .feed {
            display: grid;
            min-width: 0;
            margin-top: 32px;
        }

        .release {
            min-width: 0;
            padding: 36px 0;
            border-top: 1px solid var(--border);
        }

        .release-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .release-head h2 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
        }

        .release-head h2 a { color: inherit; text-decoration: none; }
        .release-head h2 a:hover { text-decoration: underline; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .badge-latest { background: var(--green-soft); color: var(--accent-strong); }

        .release-date {
            color: var(--text-muted);
            font-size: 13.5px;
            margin: 6px 0 22px;
        }

        .release-body {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-body);
            overflow-wrap: break-word;
        }

        .release-body > :first-child { margin-top: 0; }

        .release-body h2, .release-body h3, .release-body h4 {
            color: var(--text);
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .release-body h2 { margin: 1.75rem 0 0.6rem; font-size: 1.15rem; font-weight: 700; }
        .release-body h3, .release-body h4 { margin: 1.4rem 0 0.5rem; font-size: 1rem; font-weight: 700; }

        .release-body p { margin: 0 0 1rem; }

        .release-body ul, .release-body ol { padding-left: 1.4rem; margin: 0 0 1rem; }
        .release-body li { margin: 0.3rem 0; }
        .release-body li::marker { color: var(--text-muted); }

        .release-body strong { color: var(--text); }

        .release-body img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1.1rem 0 1.4rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--image-shadow);
        }

        .release-body code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }

        .release-body :not(pre) > code {
            background: var(--inline-code-bg);
            color: var(--text);
            padding: 0.1rem 0.35rem;
            border-radius: 5px;
            font-size: 0.85em;
        }

        .release-body pre {
            margin: 0 0 1.25rem;
            background: var(--code-bg);
            color: var(--code-text);
            padding: 1rem 1.15rem;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .release-body table {
            border-collapse: collapse;
            display: block;
            overflow-x: auto;
            max-width: 100%;
            margin: 1rem 0 1.25rem;
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .release-body th, .release-body td {
            text-align: left;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .release-body th {
            background: var(--bg-soft);
            color: var(--text);
            font-weight: 600;
        }

        .release-body blockquote {
            margin: 0 0 1.25rem;
            padding: 0.8rem 1rem;
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 4px 10px 10px 4px;
        }

        .release-body blockquote > :last-child { margin-bottom: 0; }

        .release-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 22px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover { background: var(--bg-soft); }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

        .btn.copied { color: var(--accent-strong); }

        .state {
            margin-top: 24px;
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            color: var(--text-muted);
        }

        .state a { font-weight: 600; }

        .skeleton {
            height: 220px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--bg-soft) 0%, var(--accent-soft) 50%, var(--bg-soft) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        .foot {
            border-top: 1px solid var(--border);
        }

        .foot-inner {
            max-width: 1360px;
            margin: 0 auto;
            padding: 20px 24px 32px;
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
        }

        .foot a { color: var(--text-muted); }

        @media (max-width: 899px) {
            .topbar-inner { padding: 0 16px; gap: 10px; }
            .brand { width: auto; }
            .brand-tag, .topbar-links { display: none; }
            .search { flex: 1; }
            .layout {
                grid-template-columns: minmax(0, 1fr);
                padding: 0 16px;
            }
            .versions {
                position: static;
                max-height: none;
                display: flex;
                gap: 6px;
                overflow-x: auto;
                padding: 12px 0;
            }
            .versions-title, .versions a small { display: none; }
            .versions a {
                flex: none;
                padding: 6px 12px;
                border: 1px solid var(--border);
                border-radius: 999px;
                font-size: 13.5px;
            }
            .content { padding-top: 24px; }
            .release { padding: 28px 0; }
            .foot-inner { padding: 20px 16px 32px; }
        }

        @media print {
            .topbar, .versions, .release-foot, .foot { display: none; }
            .layout { display: block; padding: 0; }
            .content { max-width: none; padding: 0; }
            .release-body pre { background: #f6f6f6; color: #000000; white-space: pre-wrap; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html" aria-label="Início do Nitzap">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </span>
                <span class="brand-name">Nitzap</span>
                <span class="brand-tag">Novidades</span>
            </a>
            <label class="search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input id="search" type="search" placeholder="Buscar: etiquetas, agendamento, IA" aria-label="Buscar uma novidade" autocomplete="off">
            </label>
            <nav class="topbar-links" aria-label="Links do Nitzap">
                <a href="docs.html">Documentação</a>
                <a href="https://github.com/DataGo-Dev/datago-public/releases" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="layout">
        <nav class="versions" id="versions" aria-label="Versões">
            <div class="versions-title">Versões</div>
        </nav>
        <div class="content">
            <h1 class="page-title">Novidades</h1>
            <p class="lead">Tudo que mudou no Nitzap, versão por versão. Novidades, melhorias e correções que chegam para o seu Salesforce.</p>
            <section class="feed" id="feed" aria-live="polite">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </section>
        </div>
    </main>

    <footer class="foot">
        <div class="foot-inner">
            <span>Nitzap é um produto DataGo.</span>
            <a href="docs.html">Documentação</a>
            <a href="https://github.com/DataGo-Dev/datago-public/releases" target="_blank" rel="noopener">Histórico completo no GitHub</a>
        </div>
    </footer>

    <script>
        const RELEASES_API = 'https://api.github.com/repos/DataGo-Dev/datago-public/releases?per_page=100';
        const RELEASES_FILE = '../releases.json';
        const CACHE_KEY = 'nitzap-releases-cache-v1';
        const CACHE_TTL_MS = 10 * 60 * 1000;
        const INSTALL_URL_PATTERN = /https?:\/\/[^\s)]*installPackage\.apexp\?p0=(04t[A-Za-z0-9]{12,15})/;

        const feed = document.getElementById('feed');
        const versionsNav = document.getElementById('versions');
        const searchInput = document.getElementById('search');

        marked.setOptions({ gfm: true, breaks: true });

        function readCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function writeCache(releases) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), releases }));
            } catch (e) {}
        }

        async function fetchReleases() {
            const response = await fetch(RELEASES_API, { headers: { Accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error('GitHub respondeu ' + response.status);
            return response.json();
        }

        async function fetchReleasesFile() {
            const response = await fetch(RELEASES_FILE, { cache: 'no-cache' });
            if (!response.ok) throw new Error('releases.json respondeu ' + response.status);
            return response.json();
        }

        async function loadReleases() {
            try {
                return await fetchReleasesFile();
            } catch (error) {}
            const cached = readCache();
            if (cached && Date.now() - cached.savedAt < CACHE_TTL_MS) return cached.releases;
            try {
                const releases = await fetchReleases();
                writeCache(releases);
                return releases;
            } catch (error) {
                if (cached) return cached.releases;
                throw error;
            }
        }

        function versionFromTag(tag) {
            return (tag || '').replace(/^v\.?/i, '').trim();
        }

        function displayName(release) {
            const name = (release.name || '').trim();
            if (!name) return versionFromTag(release.tag_name);
            return /^v\.?\d/i.test(name) ? versionFromTag(name) : name;
        }

        function formatDate(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        function formatShortDate(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
        }

        function extractInstall(body) {
            const match = body.match(INSTALL_URL_PATTERN);
            if (!match) return { body, installUrl: null };
            const isPlaceholder = /04tX{3,}/i.test(match[1]);
            const lines = body.split('\n').filter(line => !line.includes(match[0]));
            return { body: lines.join('\n'), installUrl: isPlaceholder ? null : match[0] };
        }

        function renderMarkdown(markdown) {
            const html = marked.parse(markdown);
            return DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
        }

        function normalize(text) {
            return (text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function buildRelease(release, index) {
            const version = versionFromTag(release.tag_name);
            const { body, installUrl } = extractInstall(release.body || '');
            const article = document.createElement('article');
            article.className = 'release';
            article.id = version;
            article.dataset.search = normalize(displayName(release) + ' ' + body);

            const badges = [];
            if (index === 0) badges.push('<span class="badge badge-latest">Versão atual</span>');

            const actions = [];
            if (installUrl) {
                actions.push(`<a class="btn btn-primary" href="${installUrl}" target="_blank" rel="noopener">Instalar esta versão</a>`);
            }
            actions.push(`<button class="btn" type="button" data-copy="${version}">Copiar link</button>`);

            article.innerHTML = `
                <div class="release-head">
                    <h2><a href="#${version}">${escapeHtml(displayName(release))}</a></h2>
                    ${badges.join('')}
                </div>
                <p class="release-date">${formatDate(release.published_at)}</p>
                <div class="release-body">${renderMarkdown(body)}</div>
                <div class="release-foot">${actions.join('')}</div>
            `;

            article.querySelectorAll('img').forEach(img => {
                img.loading = 'lazy';
                img.removeAttribute('width');
                img.removeAttribute('height');
            });
            article.querySelectorAll('a[href^="http"]').forEach(link => {
                link.target = '_blank';
                link.rel = 'noopener';
            });
            return article;
        }

        function buildVersionLink(release) {
            const version = versionFromTag(release.tag_name);
            const link = document.createElement('a');
            link.href = '#' + version;
            link.dataset.version = version;
            const name = displayName(release);
            const publishedOn = formatShortDate(release.published_at);
            link.title = name;
            link.innerHTML = `<span>${escapeHtml(name)}</span><small>${publishedOn}</small>`;
            return link;
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function renderState(message) {
            feed.innerHTML = `<div class="state">${message}</div>`;
        }

        function applySearch() {
            const query = normalize(searchInput.value.trim());
            let visible = 0;
            feed.querySelectorAll('.release').forEach(article => {
                const matches = !query || article.dataset.search.includes(query);
                article.hidden = !matches;
                if (matches) visible++;
            });
            versionsNav.querySelectorAll('a').forEach(link => {
                const article = document.getElementById(link.dataset.version);
                link.hidden = !article || article.hidden;
            });
            const empty = document.getElementById('empty-state');
            if (empty) empty.remove();
            if (visible === 0) {
                feed.insertAdjacentHTML('beforeend', '<div class="state" id="empty-state">Nenhuma versão fala sobre isso. Tente outra palavra.</div>');
            }
        }

        function markActiveVersion(version) {
            versionsNav.querySelectorAll('a').forEach(link => {
                const isCurrent = link.dataset.version === version;
                link.classList.toggle('active', isCurrent);
            });
            const activeLink = versionsNav.querySelector('a.active');
            if (!activeLink) return;
            const centeredOffset = activeLink.offsetTop - versionsNav.clientHeight / 2;
            versionsNav.scrollTop = centeredOffset;
        }

        function watchActiveVersion() {
            const observer = new IntersectionObserver(entries => {
                const visible = entries.filter(entry => entry.isIntersecting);
                visible.forEach(entry => markActiveVersion(entry.target.id));
            }, { rootMargin: '-10% 0px -75% 0px', threshold: 0 });
            feed.querySelectorAll('.release').forEach(article => observer.observe(article));
        }

        function copyLink(button) {
            const url = location.origin + location.pathname + '#' + button.dataset.copy;
            navigator.clipboard.writeText(url).then(() => {
                button.textContent = 'Link copiado';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = 'Copiar link';
                    button.classList.remove('copied');
                }, 1800);
            });
        }

        function scrollToHash() {
            if (!location.hash) return;
            const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
            if (target) target.scrollIntoView({ block: 'start', behavior: 'instant' });
        }

        async function init() {
            let releases;
            try {
                releases = await loadReleases();
            } catch (error) {
                renderState('Não foi possível carregar as novidades agora. Veja o <a href="https://github.com/DataGo-Dev/datago-public/releases" target="_blank" rel="noopener">histórico no GitHub</a> ou tente de novo em instantes.');
                return;
            }

            const published = releases.filter(release => !release.draft && !release.prerelease);
            if (published.length === 0) {
                renderState('Ainda não há novidades publicadas.');
                return;
            }

            feed.innerHTML = '';
            published.forEach((release, index) => {
                feed.appendChild(buildRelease(release, index));
                versionsNav.appendChild(buildVersionLink(release));
            });

            feed.addEventListener('click', event => {
                const button = event.target.closest('button[data-copy]');
                if (button) copyLink(button);
            });
            searchInput.addEventListener('input', applySearch);
            const latestVersion = versionFromTag(published[0].tag_name);
            markActiveVersion(latestVersion);
            watchActiveVersion();
            scrollToHash();
        }

        init();
    </script>
</body>
</html>
