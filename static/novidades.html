<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novidades do Nitzap</title>
    <meta name="description" content="Tudo que mudou no Nitzap, versão por versão.">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f3f7f6;
            --surface: #ffffff;
            --surface-border: rgba(15, 42, 40, 0.08);
            --text: #0d2b28;
            --text-muted: #5c7370;
            --accent: #056764;
            --accent-strong: #04514e;
            --accent-soft: #d6f2f0;
            --green: #25d366;
            --green-soft: rgba(37, 211, 102, 0.16);
            --warn-soft: #fff1d6;
            --warn-text: #7a4b00;
            --code-bg: rgba(5, 103, 100, 0.08);
            --shadow: 0 18px 40px -24px rgba(5, 44, 42, 0.35), 0 4px 12px -8px rgba(5, 44, 42, 0.2);
            --hero-bg: #04322f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #071615;
                --surface: #10201f;
                --surface-border: rgba(255, 255, 255, 0.09);
                --text: #eaf5f3;
                --text-muted: #9db5b1;
                --accent: #3ddc97;
                --accent-strong: #6ae7b3;
                --accent-soft: rgba(61, 220, 151, 0.14);
                --green: #25d366;
                --green-soft: rgba(37, 211, 102, 0.18);
                --warn-soft: rgba(255, 193, 77, 0.16);
                --warn-text: #ffd27a;
                --code-bg: rgba(61, 220, 151, 0.12);
                --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.7), 0 4px 12px -8px rgba(0, 0, 0, 0.5);
                --hero-bg: #04322f;
            }
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; scroll-padding-top: 24px; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); }

        .hero {
            background-color: var(--hero-bg);
            background-image:
                radial-gradient(120% 90% at 12% 0%, #0a8f7a 0%, rgba(10, 143, 122, 0) 55%),
                radial-gradient(100% 80% at 92% 8%, #25d366 0%, rgba(37, 211, 102, 0) 50%),
                radial-gradient(140% 120% at 50% 120%, #032523 0%, rgba(3, 37, 35, 0) 60%);
            color: #eaf5f3;
            padding: 40px 24px 48px;
        }

        .hero-inner {
            max-width: 1120px;
            margin: 0 auto;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.2px;
            color: #ffffff;
            text-decoration: none;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.25);
        }

        .hero h1 {
            margin: 22px 0 8px;
            font-size: clamp(30px, 4vw, 42px);
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        .hero p {
            margin: 0;
            max-width: 620px;
            font-size: 17px;
            color: rgba(234, 245, 243, 0.82);
        }

        .search {
            margin-top: 26px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 10px 14px;
            backdrop-filter: blur(6px);
        }

        .search svg { flex: none; opacity: 0.8; }

        .search input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: 0;
            color: #ffffff;
            font-size: 15px;
        }

        .search input::placeholder { color: rgba(234, 245, 243, 0.6); }

        .layout {
            max-width: 1120px;
            margin: -22px auto 0;
            padding: 0 24px 64px;
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 28px;
            align-items: start;
        }

        .versions {
            position: sticky;
            top: 20px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 14px 10px;
            max-height: calc(100vh - 40px);
            overflow: auto;
        }

        .versions-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 4px 10px 8px;
        }

        .versions a {
            display: block;
            padding: 8px 10px;
            border-radius: 8px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .versions a:hover { background: var(--accent-soft); }

        .versions a.active {
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-weight: 600;
        }

        .versions a small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .feed { display: grid; gap: 22px; min-width: 0; }

        .release {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 28px 32px 24px;
            min-width: 0;
        }

        .release-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            margin-bottom: 6px;
        }

        .release-head h2 {
            margin: 0;
            font-size: 26px;
            letter-spacing: -0.3px;
        }

        .release-head h2 a { color: inherit; text-decoration: none; }
        .release-head h2 a:hover { text-decoration: underline; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .badge-latest { background: var(--green-soft); color: var(--accent-strong); }

        .release-date {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 18px;
        }

        .release-body { font-size: 16px; }
        .release-body > :first-child { margin-top: 0; }

        .release-body h2, .release-body h3 {
            margin: 28px 0 10px;
            font-size: 19px;
            line-height: 1.3;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--surface-border);
        }

        .release-body h3 { font-size: 17px; border-bottom: 0; padding-bottom: 0; }

        .release-body p { margin: 0 0 12px; }

        .release-body ul, .release-body ol { padding-left: 22px; margin: 0 0 12px; }
        .release-body li { margin: 4px 0; }

        .release-body img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 14px 0;
            border-radius: 10px;
            border: 1px solid var(--surface-border);
        }

        .release-body code {
            background: var(--code-bg);
            padding: 1px 6px;
            border-radius: 5px;
            font-size: 0.92em;
        }

        .release-body pre {
            background: var(--code-bg);
            padding: 12px 14px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .release-body pre code { background: transparent; padding: 0; }

        .release-body table {
            border-collapse: collapse;
            display: block;
            overflow-x: auto;
            max-width: 100%;
            margin: 0 0 12px;
        }

        .release-body th, .release-body td {
            border: 1px solid var(--surface-border);
            padding: 6px 10px;
            text-align: left;
        }

        .release-body blockquote {
            margin: 0 0 12px;
            padding: 8px 14px;
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 0 8px 8px 0;
        }

        .release-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--surface-border);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 9px;
            border: 1px solid var(--surface-border);
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover { background: var(--accent-soft); border-color: transparent; }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

        .btn.copied { color: var(--accent-strong); }

        .state {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 36px 32px;
            text-align: center;
            color: var(--text-muted);
        }

        .state a { font-weight: 600; }

        .skeleton {
            height: 240px;
            border-radius: 16px;
            background: linear-gradient(90deg, var(--surface) 0%, var(--accent-soft) 50%, var(--surface) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border: 1px solid var(--surface-border);
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        .foot {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px 40px;
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
        }

        .foot a { color: var(--text-muted); }

        @media (max-width: 820px) {
            .hero { padding: 28px 18px 40px; }
            .layout {
                grid-template-columns: minmax(0, 1fr);
                padding: 0 14px 48px;
                gap: 16px;
            }
            .versions {
                position: static;
                max-height: none;
                min-width: 0;
                display: flex;
                gap: 4px;
                overflow-x: auto;
                padding: 10px;
            }
            .versions-title { display: none; }
            .versions a { flex: none; padding: 6px 12px; }
            .versions a small { display: none; }
            .release { padding: 20px 18px 18px; border-radius: 12px; }
            .release-head h2 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-inner">
            <a class="brand" href="#"><span class="brand-dot"></span>Nitzap</a>
            <h1>Novidades</h1>
            <p>Tudo que mudou no Nitzap, versão por versão. Novidades, melhorias e correções que chegam para o seu Salesforce.</p>
            <label class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input id="search" type="search" placeholder="Buscar uma novidade, por exemplo: etiquetas, agendamento, IA" autocomplete="off">
            </label>
        </div>
    </header>

    <main class="layout">
        <nav class="versions" id="versions" aria-label="Versões">
            <div class="versions-title">Versões</div>
        </nav>
        <section class="feed" id="feed" aria-live="polite">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </section>
    </main>

    <footer class="foot">
        <span>Nitzap é um produto DataGo.</span>
        <a href="https://github.com/DataGo-Dev/datago-public/releases" target="_blank" rel="noopener">Histórico completo no GitHub</a>
    </footer>

    <script>
        const RELEASES_API = 'https://api.github.com/repos/DataGo-Dev/datago-public/releases?per_page=100';
        const RELEASES_FILE = '../releases.json';
        const CACHE_KEY = 'nitzap-releases-cache-v1';
        const CACHE_TTL_MS = 10 * 60 * 1000;
        const INSTALL_URL_PATTERN = /https?:\/\/[^\s)]*installPackage\.apexp\?p0=(04t[A-Za-z0-9]{12,15})/;

        const feed = document.getElementById('feed');
        const versionsNav = document.getElementById('versions');
        const searchInput = document.getElementById('search');

        marked.setOptions({ gfm: true, breaks: true });

        function readCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function writeCache(releases) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), releases }));
            } catch (e) {}
        }

        async function fetchReleases() {
            const response = await fetch(RELEASES_API, { headers: { Accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error('GitHub respondeu ' + response.status);
            return response.json();
        }

        async function fetchReleasesFile() {
            const response = await fetch(RELEASES_FILE, { cache: 'no-cache' });
            if (!response.ok) throw new Error('releases.json respondeu ' + response.status);
            return response.json();
        }

        async function loadReleases() {
            try {
                return await fetchReleasesFile();
            } catch (error) {}
            const cached = readCache();
            if (cached && Date.now() - cached.savedAt < CACHE_TTL_MS) return cached.releases;
            try {
                const releases = await fetchReleases();
                writeCache(releases);
                return releases;
            } catch (error) {
                if (cached) return cached.releases;
                throw error;
            }
        }

        function versionFromTag(tag) {
            return (tag || '').replace(/^v\.?/i, '').trim();
        }

        function displayName(release) {
            const name = (release.name || '').trim();
            if (!name) return versionFromTag(release.tag_name);
            return /^v\.?\d/i.test(name) ? versionFromTag(name) : name;
        }

        function formatDate(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        function extractInstall(body) {
            const match = body.match(INSTALL_URL_PATTERN);
            if (!match) return { body, installUrl: null };
            const isPlaceholder = /04tX{3,}/i.test(match[1]);
            const lines = body.split('\n').filter(line => !line.includes(match[0]));
            return { body: lines.join('\n'), installUrl: isPlaceholder ? null : match[0] };
        }

        function renderMarkdown(markdown) {
            const html = marked.parse(markdown);
            return DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
        }

        function normalize(text) {
            return (text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function buildRelease(release, index) {
            const version = versionFromTag(release.tag_name);
            const { body, installUrl } = extractInstall(release.body || '');
            const article = document.createElement('article');
            article.className = 'release';
            article.id = version;
            article.dataset.search = normalize(displayName(release) + ' ' + body);

            const badges = [];
            if (index === 0) badges.push('<span class="badge badge-latest">Versão atual</span>');

            const actions = [];
            if (installUrl) {
                actions.push(`<a class="btn btn-primary" href="${installUrl}" target="_blank" rel="noopener">Instalar esta versão</a>`);
            }
            actions.push(`<button class="btn" type="button" data-copy="${version}">Copiar link</button>`);

            article.innerHTML = `
                <div class="release-head">
                    <h2><a href="#${version}">${escapeHtml(displayName(release))}</a></h2>
                    ${badges.join('')}
                </div>
                <p class="release-date">${formatDate(release.published_at)}</p>
                <div class="release-body">${renderMarkdown(body)}</div>
                <div class="release-foot">${actions.join('')}</div>
            `;

            article.querySelectorAll('img').forEach(img => {
                img.loading = 'lazy';
                img.removeAttribute('width');
                img.removeAttribute('height');
            });
            article.querySelectorAll('a[href^="http"]').forEach(link => {
                link.target = '_blank';
                link.rel = 'noopener';
            });
            return article;
        }

        function buildVersionLink(release) {
            const version = versionFromTag(release.tag_name);
            const link = document.createElement('a');
            link.href = '#' + version;
            link.dataset.version = version;
            link.innerHTML = `${escapeHtml(displayName(release))}<small>${formatDate(release.published_at)}</small>`;
            return link;
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function renderState(message) {
            feed.innerHTML = `<div class="state">${message}</div>`;
        }

        function applySearch() {
            const query = normalize(searchInput.value.trim());
            let visible = 0;
            feed.querySelectorAll('.release').forEach(article => {
                const matches = !query || article.dataset.search.includes(query);
                article.hidden = !matches;
                if (matches) visible++;
            });
            versionsNav.querySelectorAll('a').forEach(link => {
                const article = document.getElementById(link.dataset.version);
                link.hidden = !article || article.hidden;
            });
            const empty = document.getElementById('empty-state');
            if (empty) empty.remove();
            if (visible === 0) {
                feed.insertAdjacentHTML('beforeend', '<div class="state" id="empty-state">Nenhuma versão fala sobre isso. Tente outra palavra.</div>');
            }
        }

        function watchActiveVersion() {
            const links = Array.from(versionsNav.querySelectorAll('a'));
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    links.forEach(link => link.classList.toggle('active', link.dataset.version === entry.target.id));
                });
            }, { rootMargin: '-10% 0px -75% 0px', threshold: 0 });
            feed.querySelectorAll('.release').forEach(article => observer.observe(article));
        }

        function copyLink(button) {
            const url = location.origin + location.pathname + '#' + button.dataset.copy;
            navigator.clipboard.writeText(url).then(() => {
                button.textContent = 'Link copiado';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = 'Copiar link';
                    button.classList.remove('copied');
                }, 1800);
            });
        }

        function scrollToHash() {
            if (!location.hash) return;
            const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
            if (target) target.scrollIntoView({ block: 'start', behavior: 'instant' });
        }

        async function init() {
            let releases;
            try {
                releases = await loadReleases();
            } catch (error) {
                renderState('Não foi possível carregar as novidades agora. Veja o <a href="https://github.com/DataGo-Dev/datago-public/releases" target="_blank" rel="noopener">histórico no GitHub</a> ou tente de novo em instantes.');
                return;
            }

            const published = releases.filter(release => !release.draft && !release.prerelease);
            if (published.length === 0) {
                renderState('Ainda não há novidades publicadas.');
                return;
            }

            feed.innerHTML = '';
            published.forEach((release, index) => {
                feed.appendChild(buildRelease(release, index));
                versionsNav.appendChild(buildVersionLink(release));
            });

            feed.addEventListener('click', event => {
                const button = event.target.closest('button[data-copy]');
                if (button) copyLink(button);
            });
            searchInput.addEventListener('input', applySearch);
            watchActiveVersion();
            scrollToHash();
        }

        init();
    </script>
</body>
</html>
