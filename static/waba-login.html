<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Conectar WhatsApp Business</title>
    <style>
        :root {
            --surface: #ffffff;
            --surface-border: rgba(15, 42, 40, 0.08);
            --text: #0d2b28;
            --text-muted: #5c7370;
            --accent: #056764;
            --accent-soft: #d6f2f0;
            --danger: #ba0517;
            --shadow: 0 24px 60px -20px rgba(5, 44, 42, 0.45), 0 6px 18px -8px rgba(5, 44, 42, 0.25);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #10201f;
                --surface-border: rgba(255, 255, 255, 0.09);
                --text: #eaf5f3;
                --text-muted: #9db5b1;
                --accent: #3ddc97;
                --accent-soft: rgba(61, 220, 151, 0.14);
                --danger: #ff8a80;
                --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7), 0 6px 18px -8px rgba(0, 0, 0, 0.5);
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #04322f;
            background-image:
                radial-gradient(120% 90% at 12% 0%, #0a8f7a 0%, rgba(10, 143, 122, 0) 55%),
                radial-gradient(100% 80% at 92% 8%, #25d366 0%, rgba(37, 211, 102, 0) 50%),
                radial-gradient(140% 120% at 50% 120%, #032523 0%, rgba(3, 37, 35, 0) 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text);
            overflow: hidden;
        }

        .login-card {
            position: relative;
            width: 100%;
            max-width: 380px;
            padding: 40px 34px 28px;
            border-radius: 22px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            box-shadow: var(--shadow);
            text-align: center;
            animation: rise .5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px) scale(.985); }
            to { opacity: 1; transform: none; }
        }

        .badge {
            position: relative;
            width: 68px;
            height: 68px;
            margin: 0 auto 22px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #25d366, #0a8f7a);
            box-shadow: 0 10px 24px -10px rgba(10, 143, 122, .9);
        }

        .badge svg { width: 36px; height: 36px; display: block; }

        .badge::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 28px;
            border: 2px solid rgba(37, 211, 102, .35);
            animation: halo 2.4s ease-out infinite;
        }

        @keyframes halo {
            0% { transform: scale(.92); opacity: .9; }
            70% { transform: scale(1.12); opacity: 0; }
            100% { opacity: 0; }
        }

        .login-card:has(#status.error) .badge {
            background: linear-gradient(145deg, #ff7a6e, #ba0517);
            box-shadow: 0 10px 24px -10px rgba(186, 5, 23, .75);
        }

        .login-card:has(#status.error) .badge::after { display: none; }

        h1 {
            margin: 0 0 10px;
            font-size: 20px;
            line-height: 1.3;
            font-weight: 650;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        p {
            margin: 0;
            font-size: 14px;
            line-height: 1.55;
            color: var(--text-muted);
        }

        p.error {
            color: var(--danger);
            font-weight: 500;
        }

        .loader {
            position: relative;
            width: 100%;
            height: 4px;
            margin: 22px 0 18px;
            border-radius: 99px;
            background: var(--accent-soft);
            overflow: hidden;
        }

        .loader::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 42%;
            border-radius: 99px;
            background: linear-gradient(90deg, rgba(37, 211, 102, 0), #25d366, var(--accent));
            animation: slide 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes slide {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(275%); }
        }

        .loader.hidden { display: none; }
        .loader.hidden + p { margin-top: 22px; }

        .footnote {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px solid var(--surface-border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .footnote svg {
            width: 13px;
            height: 13px;
            opacity: .75;
        }

        @media (prefers-reduced-motion: reduce) {
            .login-card, .badge::after, .loader::after { animation: none; }
            .badge::after { opacity: 0; }
            .loader::after { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="badge">
            <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
                <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.17 8.17 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.13-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.8-.78.97-.15.16-.29.19-.54.06-.25-.12-1.05-.38-1.99-1.23-.74-.65-1.23-1.46-1.38-1.71-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.42-.14-.01-.31-.01-.47-.01-.16 0-.43.06-.66.31-.22.25-.87.85-.87 2.07s.89 2.4 1.02 2.56c.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.08.15-1.18-.06-.11-.22-.17-.47-.29Z"/>
            </svg>
        </div>
        <h1 id="title">Conectando ao WhatsApp Business</h1>
        <div class="loader" id="loader"></div>
        <p id="status">Mantenha esta janela aberta até que ela se feche sozinha</p>
        <div class="footnote">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M17 9V7A5 5 0 0 0 7 7v2H5v12h14V9h-2Zm-8 0V7a3 3 0 0 1 6 0v2H9Z"/>
            </svg>
            <span>Conexão segura via Meta · Nitzap</span>
        </div>
    </div>

    <div id="fb-root"></div>
    <script>
        const APP_ID = '1617523109227160';
        const CONFIG_ID = '699181689790896';
        const VERSION = 'v25.0';
        const ALLOWED_API_HOST = /^https:\/\/([a-z0-9-]+\.)+(nitzap|datago)\.com$/;
        const FACEBOOK_ORIGINS = ['https://www.facebook.com', 'https://web.facebook.com'];
        const SUPPORTED_MODES = ['coex'];

        const params = new URLSearchParams(window.location.search);
        const apiBaseUrl = params.get('api') || '';
        const state = params.get('state') || '';
        const mode = params.get('mode') || 'coex';

        const collected = {};
        let alreadyReported = false;

        function showStatus(message, isError) {
            document.getElementById('status').textContent = message;
            document.getElementById('status').className = isError ? 'error' : '';
            if (isError) {
                document.getElementById('title').textContent = 'Não foi possível conectar';
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function paramsAreValid() {
            if (!ALLOWED_API_HOST.test(apiBaseUrl)) {
                showStatus('Endereço de servidor não autorizado. Feche esta janela e inicie a conexão pelo Salesforce.', true);
                return false;
            }
            if (!/^[a-f0-9]{16,}$/.test(state)) {
                showStatus('Link inválido ou expirado. Feche esta janela e tente novamente pelo Salesforce.', true);
                return false;
            }
            if (!SUPPORTED_MODES.includes(mode)) {
                showStatus('Modo de conexão não suportado: ' + mode, true);
                return false;
            }
            return true;
        }

        function buildExtras() {
            if (mode === 'coex') {
                return {
                    version: 'v4',
                    featureType: 'whatsapp_business_app_onboarding',
                    features: [{ name: 'app_only_install' }, { name: 'marketing_messages_lite' }]
                };
            }
            return {};
        }

        async function report(payload) {
            if (alreadyReported) { return; }
            alreadyReported = true;

            try {
                const response = await fetch(apiBaseUrl + '/waba/onboarding/finish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.assign({ state: state }, payload))
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.success === false) {
                    showStatus(data.message || 'O servidor recusou a conexão. Tente novamente pelo Salesforce.', true);
                    return;
                }
                showStatus('Conectado! Você já pode fechar esta janela.');
                window.close();
            } catch (error) {
                alreadyReported = false;
                showStatus('Falha ao falar com o servidor: ' + error.message, true);
            }
        }

        function reportFailure(message) {
            showStatus(message, true);
            report({ error: message });
        }

        function reportWhenComplete() {
            if (!collected.code || !collected.info) { return; }
            showStatus('Finalizando a conexão...');
            report({
                code: collected.code,
                wabaId: collected.info.waba_id,
                phoneNumberId: collected.info.phone_number_id
            });
        }

        window.fbAsyncInit = function() {
            FB.init({
                appId: APP_ID,
                autoLogAppEvents: true,
                xfbml: true,
                version: VERSION
            });
            startLogin();
        };

        let loginStarted = false;
        function startLogin() {
            if (loginStarted) { return; }
            loginStarted = true;

            FB.login(function(response) {
                if (response.authResponse && response.authResponse.code) {
                    collected.code = response.authResponse.code;
                    reportWhenComplete();
                    return;
                }
                reportFailure('Login do Facebook cancelado.');
            }, {
                config_id: CONFIG_ID,
                response_type: 'code',
                override_default_response_type: true,
                extras: buildExtras()
            });
        }

        window.addEventListener('message', function(event) {
            if (!FACEBOOK_ORIGINS.includes(event.origin)) { return; }

            let data;
            try {
                data = JSON.parse(event.data);
            } catch (error) {
                return;
            }

            if (data.type !== 'WA_EMBEDDED_SIGNUP') { return; }

            if (data.event === 'FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING') {
                collected.info = data.data;
                reportWhenComplete();
                return;
            }

            if (data.event === 'FINISH_ONLY_WABA') {
                reportFailure('O cadastro terminou sem um número de telefone. Refaça o processo cadastrando o número.');
                return;
            }

            if (data.event === 'CANCEL') {
                const step = data.data && data.data.current_step ? ' (etapa: ' + data.data.current_step + ')' : '';
                reportFailure('Cadastro cancelado' + step + '.');
            }
        });

        if (paramsAreValid()) {
            (function(d, s, id){
                var js, fjs = d.getElementsByTagName(s)[0];
                if (d.getElementById(id)) return;
                js = d.createElement(s); js.id = id;
                js.src = "https://connect.facebook.net/en_US/sdk.js";
                fjs.parentNode.insertBefore(js, fjs);
            }(document, 'script', 'facebook-jssdk'));
        }
    </script>
</body>
</html>
