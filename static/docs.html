<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentação do Nitzap</title>
    <meta name="description" content="Guias de configuração e referência técnica do Nitzap.">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --bg-soft: #f5f8f7;
            --bg-bar: rgba(255, 255, 255, 0.94);
            --border: #e2e8e6;
            --text: #17211f;
            --text-body: #2c3836;
            --text-muted: #62716e;
            --accent: #056764;
            --accent-strong: #04514e;
            --accent-soft: #e4f3f0;
            --green: #25d366;
            --inline-code-bg: #edf2f0;
            --code-bg: #111c1b;
            --code-border: transparent;
            --code-text: #e4efec;
            --warn: #b97700;
            --warn-soft: #fff5dc;
            --image-shadow: 0 10px 28px -18px rgba(13, 43, 40, 0.45);
            --topbar-height: 60px;
            --nav-width: 240px;
            --column-gap: 48px;
        }

        * { box-sizing: border-box; }

        [hidden] { display: none !important; }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--topbar-height) + 20px);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg-bar);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .topbar-inner {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 24px;
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand {
            flex: none;
            width: calc(var(--nav-width) + var(--column-gap) - 16px);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            text-decoration: none;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, #25d366, #0a8f7a);
            color: #ffffff;
            box-shadow: 0 6px 14px -6px rgba(37, 211, 102, 0.7);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-tag {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 1px 8px;
        }

        .search {
            flex: 0 1 420px;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 7px 12px;
            color: var(--text-muted);
        }

        .search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search svg { flex: none; }

        .search input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        .search input::placeholder { color: var(--text-muted); }

        .topbar-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .topbar-links a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .topbar-links a:hover { color: var(--text); }

        .layout {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: var(--nav-width) minmax(0, 1fr) 220px;
            grid-template-areas: "nav content toc";
            column-gap: var(--column-gap);
            align-items: start;
        }

        .docs-nav {
            grid-area: nav;
            position: sticky;
            top: var(--topbar-height);
            max-height: calc(100vh - var(--topbar-height));
            overflow-y: auto;
            padding: 32px 0;
            display: grid;
            gap: 2px;
        }

        .nav-title, .nav-group, .toc summary {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .nav-title, .nav-group { padding: 0 10px 8px; }

        .nav-group { margin-top: 22px; }

        .docs-nav a {
            display: block;
            padding: 7px 10px;
            border-radius: 7px;
            color: var(--text-body);
            text-decoration: none;
            font-size: 14.5px;
            line-height: 1.35;
        }

        .docs-nav a:hover { background: var(--bg-soft); }

        .docs-nav a.active {
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-weight: 600;
        }

        .toc {
            grid-area: toc;
            position: sticky;
            top: var(--topbar-height);
            max-height: calc(100vh - var(--topbar-height));
            overflow-y: auto;
            padding: 36px 0 32px;
            font-size: 13px;
        }

        .toc summary {
            list-style: none;
            pointer-events: none;
            padding-bottom: 10px;
        }

        .toc summary::-webkit-details-marker { display: none; }

        .toc-links {
            display: grid;
            border-left: 1px solid var(--border);
        }

        .toc-links a {
            margin-left: -1px;
            padding: 4px 0 4px 14px;
            border-left: 2px solid transparent;
            color: var(--text-muted);
            text-decoration: none;
            line-height: 1.4;
        }

        .toc-links a.toc-h3 { padding-left: 28px; }

        .toc-links a:hover { color: var(--text); }

        .toc-links a.active {
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 600;
        }

        .content {
            grid-area: content;
            min-width: 0;
            max-width: 780px;
            padding: 32px 0 56px;
        }

        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .breadcrumb > * + *::before {
            content: "/";
            margin: 0 8px;
            color: var(--border);
        }

        .breadcrumb a { text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        .doc-title {
            margin: 0;
            font-size: clamp(1.75rem, 3vw, 2.15rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        .doc-date {
            color: var(--text-muted);
            font-size: 13.5px;
            margin: 10px 0 0;
        }

        .lead {
            margin: 12px 0 0;
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .doc-body {
            margin-top: 28px;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-body);
            overflow-wrap: break-word;
        }

        .doc-body > :first-child { margin-top: 0; }

        .doc-body h2, .doc-body h3, .doc-body h4, .doc-body h5 {
            color: var(--text);
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .doc-body h2 { margin: 2.75rem 0 0.75rem; font-size: 1.45rem; font-weight: 750; }
        .doc-body h3 { margin: 2rem 0 0.5rem; font-size: 1.15rem; font-weight: 700; }
        .doc-body h4, .doc-body h5 { margin: 1.5rem 0 0.5rem; font-size: 1rem; font-weight: 700; }

        .heading-anchor {
            margin-left: 8px;
            font-weight: 400;
            text-decoration: none;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .heading-anchor::before { content: "#"; }

        .doc-body h2:hover .heading-anchor,
        .doc-body h3:hover .heading-anchor,
        .doc-body h4:hover .heading-anchor,
        .heading-anchor:focus { opacity: 0.7; }

        .doc-body p { margin: 0 0 1rem; }

        .doc-body ul, .doc-body ol { padding-left: 1.4rem; margin: 0 0 1rem; }
        .doc-body li { margin: 0.3rem 0; }
        .doc-body li::marker { color: var(--text-muted); }

        .doc-body strong { color: var(--text); }

        .doc-body hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 2.25rem 0;
        }

        .doc-body img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1.1rem 0 1.4rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--image-shadow);
        }

        .doc-body code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }

        .doc-body :not(pre) > code {
            background: var(--inline-code-bg);
            color: var(--text);
            padding: 0.1rem 0.35rem;
            border-radius: 5px;
            font-size: 0.85em;
        }

        .code-block {
            position: relative;
            margin: 0 0 1.25rem;
        }

        .doc-body pre {
            margin: 0;
            background: var(--code-bg);
            color: var(--code-text);
            border: 1px solid var(--code-border);
            padding: 1rem 1.15rem;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .doc-body pre code.hljs { background: transparent; padding: 0; }

        .hljs-comment, .hljs-quote { color: #7d9490; font-style: italic; }
        .hljs-keyword, .hljs-selector-tag, .hljs-meta { color: #c9a8ff; }
        .hljs-string, .hljs-regexp { color: #a8e08a; }
        .hljs-number, .hljs-literal { color: #f5b971; }
        .hljs-attr, .hljs-type, .hljs-built_in { color: #7cc7ff; }
        .hljs-title, .hljs-title.function_, .hljs-title.class_ { color: #ffd580; }

        .code-copy {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(30, 44, 42, 0.92);
            color: #cfe0dc;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .code-block:hover .code-copy, .code-copy:focus { opacity: 1; }

        .code-copy:hover { color: #ffffff; border-color: rgba(255, 255, 255, 0.32); }

        .code-copy.copied { color: #7be4bd; opacity: 1; }

        @media (hover: none) {
            .code-copy { opacity: 1; }
        }

        .table-scroll {
            margin: 1rem 0 1.25rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow-x: auto;
        }

        .doc-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .doc-body th, .doc-body td {
            text-align: left;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .doc-body th {
            background: var(--bg-soft);
            color: var(--text);
            font-weight: 600;
            white-space: nowrap;
        }

        .doc-body tr:last-child td { border-bottom: 0; }

        .doc-body blockquote {
            margin: 0 0 1.25rem;
            padding: 0.8rem 1rem;
            border: 1px solid transparent;
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 4px 10px 10px 4px;
        }

        .doc-body blockquote.callout-warn {
            border-left-color: var(--warn);
            background: var(--warn-soft);
        }

        .doc-body blockquote > :last-child { margin-bottom: 0; }

        .pager {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 56px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
        }

        .pager-link {
            display: grid;
            gap: 2px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
        }

        .pager-link:hover { border-color: var(--accent); background: var(--bg-soft); }

        .pager-link small { color: var(--text-muted); font-size: 12.5px; }

        .pager-link span { font-weight: 600; line-height: 1.35; }

        .pager-next { grid-column: 2; text-align: right; }

        .doc-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            margin-top: 20px;
            font-size: 13.5px;
        }

        .doc-actions a, .doc-actions button {
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font: inherit;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .doc-actions a:hover, .doc-actions button:hover, .doc-actions .copied { color: var(--accent); }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 32px;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            color: var(--text);
            text-decoration: none;
            min-width: 0;
        }

        .card:hover { border-color: var(--accent); background: var(--bg-soft); }

        .card h2 {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.35;
            letter-spacing: -0.01em;
        }

        .card p {
            margin: 0;
            font-size: 14px;
            line-height: 1.55;
            color: var(--text-muted);
            flex: 1;
        }

        .card small {
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .state {
            margin-top: 24px;
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            color: var(--text-muted);
        }

        .state a { font-weight: 600; }

        .skeleton {
            height: 260px;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--bg-soft) 0%, var(--accent-soft) 50%, var(--bg-soft) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        .foot {
            border-top: 1px solid var(--border);
        }

        .foot-inner {
            max-width: 1360px;
            margin: 0 auto;
            padding: 20px 24px 32px;
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
        }

        .foot a { color: var(--text-muted); }

        @media (max-width: 1179px) {
            .layout {
                grid-template-columns: var(--nav-width) minmax(0, 1fr);
                grid-template-areas: "nav toc" "nav content";
            }
            .toc {
                position: static;
                max-height: none;
                max-width: 780px;
                margin-top: 28px;
                padding: 0;
                border: 1px solid var(--border);
                border-radius: 10px;
            }
            .toc summary {
                list-style: revert;
                pointer-events: auto;
                padding: 10px 14px;
                cursor: pointer;
            }
            .toc summary::-webkit-details-marker { display: revert; }
            .toc-links { margin: 0 14px 12px; }
            .toc:not([hidden]) + .content { padding-top: 22px; }
        }

        @media (max-width: 899px) {
            .topbar-inner { padding: 0 16px; gap: 10px; }
            .brand { width: auto; }
            .brand-tag, .topbar-links { display: none; }
            .search { flex: 1; }
            .layout {
                grid-template-columns: minmax(0, 1fr);
                grid-template-areas: "nav" "toc" "content";
                padding: 0 16px;
            }
            .docs-nav {
                position: static;
                max-height: none;
                display: flex;
                gap: 6px;
                overflow-x: auto;
                padding: 12px 0;
            }
            .nav-title, .nav-group { display: none; }
            .docs-nav a {
                flex: none;
                padding: 6px 12px;
                border: 1px solid var(--border);
                border-radius: 999px;
                white-space: nowrap;
                font-size: 13.5px;
            }
            .toc { margin-top: 8px; }
            .content { padding-top: 24px; }
            .pager { grid-template-columns: minmax(0, 1fr); }
            .pager-next { grid-column: 1; }
            .foot-inner { padding: 20px 16px 32px; }
        }

        @media print {
            :root {
                --bg: #ffffff;
                --text: #000000;
                --text-body: #000000;
                --text-muted: #444444;
                --border: #cccccc;
                --inline-code-bg: #f0f0f0;
                --code-bg: #f6f6f6;
                --code-border: #cccccc;
                --code-text: #000000;
            }
            .topbar, .docs-nav, .toc, .pager, .doc-actions, .foot, .heading-anchor, .code-copy { display: none; }
            .layout { display: block; padding: 0; }
            .content { max-width: none; padding: 0; }
            .doc-body pre { white-space: pre-wrap; }
            .doc-body pre code * { color: #000000; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html" aria-label="Início do Nitzap">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </span>
                <span class="brand-name">Nitzap</span>
                <span class="brand-tag">Docs</span>
            </a>
            <label class="search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input id="search" type="search" placeholder="Buscar: template, Apex, bot" aria-label="Buscar na documentação" autocomplete="off">
            </label>
            <nav class="topbar-links" aria-label="Links do Nitzap">
                <a href="novidades.html">Novidades</a>
                <a href="https://github.com/DataGo-Dev/datago-public/tree/main/docs" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="layout">
        <nav class="docs-nav" id="docs-nav" aria-label="Documentos">
            <div class="nav-title">Documentação</div>
            <a href="#" id="home-link">Visão geral</a>
        </nav>
        <details class="toc" id="toc" hidden>
            <summary>Nesta página</summary>
            <nav class="toc-links" id="toc-links" aria-label="Seções deste documento"></nav>
        </details>
        <section class="content" id="content" aria-live="polite">
            <div class="skeleton"></div>
        </section>
    </main>

    <footer class="foot">
        <div class="foot-inner">
            <span>Nitzap é um produto DataGo.</span>
            <a href="novidades.html">Novidades por versão</a>
            <a href="https://github.com/DataGo-Dev/datago-public/tree/main/docs" target="_blank" rel="noopener">Fontes no GitHub</a>
        </div>
    </footer>

    <script>
        const DOCS_FILE = '../docs.json';
        const DOCS_BASE_URL = new URL('../docs/', location.href);
        const GITHUB_DOC_PATTERN = /^https?:\/\/github\.com\/DataGo-Dev\/datago-public\/blob\/[^/]+\/docs\/(.+?\.md)(#.*)?$/i;
        const PAGE_TITLE = document.title;
        const PAGE_LEAD = 'Guias de configuração e referência técnica do Nitzap para o seu Salesforce.';
        const WIDE_SCREEN = window.matchMedia('(min-width: 1180px)');
        const WRAPPER_CLASS_BY_TAG = { table: 'table-scroll', pre: 'code-block' };
        const COPY_CODE_BUTTON = '<button class="code-copy" type="button" data-copy-code data-label="Copiar" data-done="Copiado">Copiar</button>';
        const COPIED_LABEL_MILLIS = 1800;
        const SECTION_ACTIVATION_LINE = 110;
        const PAGE_END_TOLERANCE = 2;

        const content = document.getElementById('content');
        const docsNav = document.getElementById('docs-nav');
        const homeLink = document.getElementById('home-link');
        const toc = document.getElementById('toc');
        const tocLinks = document.getElementById('toc-links');
        const searchInput = document.getElementById('search');

        let docsBySlug = new Map();
        let currentSlug = null;
        let activeSectionId = null;

        marked.setOptions({ gfm: true, breaks: true });
        if (window.hljs) hljs.registerAliases('apex', { languageName: 'java' });

        async function loadDocs() {
            const response = await fetch(DOCS_FILE, { cache: 'no-cache' });
            if (!response.ok) throw new Error('docs.json respondeu ' + response.status);
            return response.json();
        }

        function formatDate(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function normalize(text) {
            return (text || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
        }

        function slugify(text) {
            return normalize(text).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'secao';
        }

        function humanize(name) {
            return name.replace(/[_-]+/g, ' ').replace(/^\w/, ch => ch.toUpperCase());
        }

        function renderMarkdown(markdown) {
            const html = marked.parse(markdown);
            return DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
        }

        function docSlugFromHref(href, doc) {
            const github = href.match(GITHUB_DOC_PATTERN);
            if (github) return github[1].replace(/\.md$/i, '');
            if (/^[a-z]+:/i.test(href) || href.startsWith('#')) return null;
            const resolved = new URL(href, new URL(doc.path, DOCS_BASE_URL));
            if (!resolved.href.startsWith(DOCS_BASE_URL.href) || !/\.md$/i.test(resolved.pathname)) return null;
            return decodeURIComponent(resolved.href.slice(DOCS_BASE_URL.href.length)).replace(/\.md$/i, '');
        }

        function rewriteLinks(container, doc) {
            container.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href');
                const slug = docSlugFromHref(href, doc);
                if (slug && docsBySlug.has(slug)) {
                    link.href = '#' + slug;
                    return;
                }
                if (/^https?:/i.test(href)) {
                    link.target = '_blank';
                    link.rel = 'noopener';
                }
            });
        }

        function fitImages(container, doc) {
            container.querySelectorAll('img').forEach(img => {
                const src = img.getAttribute('src') || '';
                if (!/^[a-z]+:/i.test(src)) img.src = new URL(src, new URL(doc.path, DOCS_BASE_URL)).href;
                img.loading = 'lazy';
                img.removeAttribute('width');
                img.removeAttribute('height');
            });
        }

        function buildDocBody(doc) {
            const body = document.createElement('div');
            body.className = 'doc-body';
            body.innerHTML = renderMarkdown(doc.body);
            return body;
        }

        function demoteHeadings(body) {
            const repeatsPageTitleLevel = body.querySelector('h1') !== null;
            if (!repeatsPageTitleLevel) return;
            const headings = Array.from(body.querySelectorAll('h1, h2, h3, h4, h5'));
            headings.forEach(heading => {
                const level = Number(heading.tagName.slice(1));
                const demoted = document.createElement('h' + (level + 1));
                demoted.innerHTML = heading.innerHTML;
                heading.replaceWith(demoted);
            });
        }

        function assignHeadingIds(body, doc) {
            const used = new Set();
            body.querySelectorAll('h2, h3, h4').forEach(heading => {
                const baseId = slugify(heading.textContent);
                let id = baseId;
                let attempt = 1;
                while (used.has(id)) id = `${baseId}-${++attempt}`;
                used.add(id);
                heading.id = id;
                heading.insertAdjacentHTML('beforeend', `<a class="heading-anchor" href="#${doc.slug}/${id}" aria-label="Link para esta seção"></a>`);
            });
        }

        function wrapScrollableBlocks(body) {
            Object.entries(WRAPPER_CLASS_BY_TAG).forEach(([tag, wrapperClass]) => {
                body.querySelectorAll(tag).forEach(block => {
                    const wrapper = document.createElement('div');
                    wrapper.className = wrapperClass;
                    block.replaceWith(wrapper);
                    wrapper.appendChild(block);
                });
            });
        }

        function addCopyCodeButtons(body) {
            body.querySelectorAll('.code-block').forEach(block => block.insertAdjacentHTML('beforeend', COPY_CODE_BUTTON));
        }

        function highlightCode(body) {
            if (!window.hljs) return;
            body.querySelectorAll('pre code[class*="language-"]').forEach(code => hljs.highlightElement(code));
        }

        function markWarningCallouts(body) {
            body.querySelectorAll('blockquote').forEach(quote => {
                const text = quote.textContent.trim();
                const isWarning = text.startsWith('⚠');
                quote.classList.toggle('callout-warn', isWarning);
            });
        }

        function docHeadHtml(doc) {
            const title = escapeHtml(doc.title);
            const groupName = humanize(doc.group);
            const groupCrumb = doc.group ? `<span>${escapeHtml(groupName)}</span>` : '';
            return `
                <nav class="breadcrumb" aria-label="Trilha">
                    <a href="#">Documentação</a>${groupCrumb}<span>${title}</span>
                </nav>
                <h1 class="doc-title">${title}</h1>
                <p class="doc-date">Atualizado em ${formatDate(doc.updatedAt)}</p>
            `;
        }

        function pagerHtml(doc) {
            const slugs = Array.from(docsBySlug.keys());
            const position = slugs.indexOf(doc.slug);
            const previous = docsBySlug.get(slugs[position - 1]);
            const next = docsBySlug.get(slugs[position + 1]);
            const previousLink = previous ? `<a class="pager-link" href="#${previous.slug}"><small>Anterior</small><span>${escapeHtml(previous.title)}</span></a>` : '';
            const nextLink = next ? `<a class="pager-link pager-next" href="#${next.slug}"><small>Próximo</small><span>${escapeHtml(next.title)}</span></a>` : '';
            return `<nav class="pager" aria-label="Outros documentos">${previousLink}${nextLink}</nav>`;
        }

        function docActionsHtml(doc) {
            return `
                <div class="doc-actions">
                    <button type="button" data-copy-link="${doc.slug}" data-label="Copiar link" data-done="Link copiado">Copiar link</button>
                    <a href="${doc.html_url}" target="_blank" rel="noopener">Ver no GitHub</a>
                </div>
            `;
        }

        function buildCard(doc) {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = '#' + doc.slug;
            card.dataset.slug = doc.slug;
            card.innerHTML = `
                <h2>${escapeHtml(doc.title)}</h2>
                <p>${escapeHtml(doc.summary)}</p>
                <small>Atualizado em ${formatDate(doc.updatedAt)}</small>
            `;
            return card;
        }

        function buildNav(docs) {
            let lastGroup = null;
            docs.forEach(doc => {
                const startsGroup = doc.group && doc.group !== lastGroup;
                if (startsGroup) {
                    const groupName = humanize(doc.group);
                    docsNav.insertAdjacentHTML('beforeend', `<div class="nav-group">${escapeHtml(groupName)}</div>`);
                }
                lastGroup = doc.group;
                const link = document.createElement('a');
                link.href = '#' + doc.slug;
                link.dataset.slug = doc.slug;
                link.textContent = doc.title;
                docsNav.appendChild(link);
            });
        }

        function updateNav(doc) {
            const isHome = !doc;
            homeLink.classList.toggle('active', isHome);
            docsNav.querySelectorAll('a[data-slug]').forEach(link => {
                const isCurrent = !isHome && link.dataset.slug === doc.slug;
                link.classList.toggle('active', isCurrent);
            });
        }

        function renderToc(doc, body) {
            const headings = Array.from(body.querySelectorAll('h2, h3'));
            activeSectionId = null;
            tocLinks.innerHTML = '';
            toc.scrollTop = 0;
            toc.hidden = headings.length === 0;
            headings.forEach(heading => {
                const link = document.createElement('a');
                link.href = `#${doc.slug}/${heading.id}`;
                link.dataset.heading = heading.id;
                link.className = 'toc-' + heading.tagName.toLowerCase();
                link.textContent = heading.textContent.trim();
                tocLinks.appendChild(link);
            });
        }

        function clearToc() {
            activeSectionId = null;
            tocLinks.innerHTML = '';
            toc.hidden = true;
        }

        function markActiveSection(headingId) {
            tocLinks.querySelectorAll('a').forEach(link => {
                const isCurrent = link.dataset.heading === headingId;
                link.classList.toggle('active', isCurrent);
            });
            const activeLink = tocLinks.querySelector('a.active');
            const centeredOffset = activeLink ? activeLink.offsetTop - toc.clientHeight / 2 : 0;
            toc.scrollTop = centeredOffset;
        }

        function currentSectionId() {
            const headings = Array.from(content.querySelectorAll('.doc-body h2, .doc-body h3'));
            const scrolledBottom = window.innerHeight + window.scrollY;
            const reachedPageEnd = scrolledBottom >= document.documentElement.scrollHeight - PAGE_END_TOLERANCE;
            const passed = headings.filter(heading => {
                const top = heading.getBoundingClientRect().top;
                return reachedPageEnd || top <= SECTION_ACTIVATION_LINE;
            });
            const current = passed[passed.length - 1];
            return current ? current.id : null;
        }

        function followActiveSection() {
            const headingId = currentSectionId();
            if (headingId === activeSectionId) return;
            activeSectionId = headingId;
            markActiveSection(headingId);
        }

        function syncTocDisclosure() {
            toc.open = WIDE_SCREEN.matches;
        }

        function collapseTocOnNarrowScreen() {
            if (WIDE_SCREEN.matches) return;
            toc.open = false;
        }

        function renderState(message) {
            content.innerHTML = `<div class="state">${message}</div>`;
        }

        function filterDocs() {
            const typed = searchInput.value.trim();
            const query = normalize(typed);
            let visible = 0;
            docsBySlug.forEach(doc => {
                const matches = !query || doc.search.includes(query);
                if (matches) visible++;
                content.querySelectorAll(`.card[data-slug="${doc.slug}"]`).forEach(card => card.hidden = !matches);
                docsNav.querySelectorAll(`a[data-slug="${doc.slug}"]`).forEach(link => link.hidden = !matches);
            });
            const empty = document.getElementById('empty-state');
            if (empty) empty.remove();
            const nothingFoundOnHome = visible === 0 && currentSlug === null;
            if (nothingFoundOnHome) {
                content.insertAdjacentHTML('beforeend', '<div class="state" id="empty-state">Nenhum documento fala sobre isso. Tente outra palavra.</div>');
            }
        }

        function renderHome() {
            currentSlug = null;
            document.title = PAGE_TITLE;
            const cards = document.createElement('div');
            cards.className = 'cards';
            docsBySlug.forEach(doc => cards.appendChild(buildCard(doc)));
            content.innerHTML = `<h1 class="doc-title">Documentação</h1><p class="lead">${PAGE_LEAD}</p>`;
            content.appendChild(cards);
            updateNav(null);
            clearToc();
            filterDocs();
        }

        function renderDoc(doc) {
            currentSlug = doc.slug;
            document.title = `${doc.title} · ${PAGE_TITLE}`;
            const body = buildDocBody(doc);
            demoteHeadings(body);
            assignHeadingIds(body, doc);
            rewriteLinks(body, doc);
            fitImages(body, doc);
            wrapScrollableBlocks(body);
            addCopyCodeButtons(body);
            highlightCode(body);
            markWarningCallouts(body);
            const head = docHeadHtml(doc);
            const pager = pagerHtml(doc);
            const actions = docActionsHtml(doc);
            const article = document.createElement('article');
            article.insertAdjacentHTML('beforeend', head);
            article.appendChild(body);
            article.insertAdjacentHTML('beforeend', pager);
            article.insertAdjacentHTML('beforeend', actions);
            content.innerHTML = '';
            content.appendChild(article);
            updateNav(doc);
            renderToc(doc, body);
        }

        function renderNotFound() {
            currentSlug = null;
            document.title = PAGE_TITLE;
            updateNav(null);
            clearToc();
            renderState('Esse documento não existe mais ou mudou de endereço. <a href="#">Ver todos os documentos</a>');
        }

        function resolveHash() {
            const key = decodeURIComponent(location.hash.slice(1));
            if (!key) return { home: true };
            if (docsBySlug.has(key)) return { slug: key };
            const separator = key.lastIndexOf('/');
            if (separator > 0 && docsBySlug.has(key.slice(0, separator))) {
                return { slug: key.slice(0, separator), heading: key.slice(separator + 1) };
            }
            return { notFound: true };
        }

        function scrollToHeading(id) {
            const target = document.getElementById(id);
            if (target) target.scrollIntoView({ block: 'start', behavior: 'instant' });
        }

        function route() {
            const target = resolveHash();
            if (target.home) return renderHome();
            if (target.notFound) return renderNotFound();
            const isAnotherDoc = target.slug !== currentSlug;
            if (isAnotherDoc) {
                const doc = docsBySlug.get(target.slug);
                renderDoc(doc);
            }
            if (target.heading) scrollToHeading(target.heading);
            else if (isAnotherDoc) window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function handleSearchInput() {
            const isReadingDoc = currentSlug !== null;
            const hasQuery = searchInput.value.trim() !== '';
            if (isReadingDoc && hasQuery) {
                history.replaceState(null, '', location.pathname);
                renderHome();
                return;
            }
            filterDocs();
        }

        function flashCopied(button) {
            button.textContent = button.dataset.done;
            button.classList.add('copied');
            setTimeout(() => {
                button.textContent = button.dataset.label;
                button.classList.remove('copied');
            }, COPIED_LABEL_MILLIS);
        }

        function copyLink(button) {
            const url = location.origin + location.pathname + '#' + button.dataset.copyLink;
            navigator.clipboard.writeText(url).then(() => flashCopied(button));
        }

        function copyCode(button) {
            const code = button.parentElement.querySelector('pre').textContent;
            navigator.clipboard.writeText(code).then(() => flashCopied(button));
        }

        function handleContentClick(event) {
            const linkButton = event.target.closest('button[data-copy-link]');
            if (linkButton) copyLink(linkButton);
            const codeButton = event.target.closest('button[data-copy-code]');
            if (codeButton) copyCode(codeButton);
        }

        async function init() {
            WIDE_SCREEN.addEventListener('change', syncTocDisclosure);
            syncTocDisclosure();

            let docs;
            try {
                docs = await loadDocs();
            } catch (error) {
                renderState('Não foi possível carregar a documentação agora. Veja as <a href="https://github.com/DataGo-Dev/datago-public/tree/main/docs" target="_blank" rel="noopener">fontes no GitHub</a> ou tente de novo em instantes.');
                return;
            }

            if (docs.length === 0) {
                renderState('Ainda não há documentos publicados.');
                return;
            }

            docsBySlug = new Map(docs.map(doc => [doc.slug, { ...doc, search: normalize(doc.title + ' ' + doc.body) }]));
            buildNav(docs);

            content.addEventListener('click', handleContentClick);
            tocLinks.addEventListener('click', collapseTocOnNarrowScreen);
            searchInput.addEventListener('input', handleSearchInput);
            window.addEventListener('scroll', followActiveSection, { passive: true });
            window.addEventListener('hashchange', route);
            route();
        }

        init();
    </script>
</body>
</html>
