name: docs-page

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/docs_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Gerar docs.json
        run: python3 .github/scripts/docs_index.py docs docs.json

      - name: Publicar
        run: |
          git add docs.json
          if git diff --cached --quiet; then
            echo "Sem mudança para publicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs.json: $(python3 -c "import json; print(len(json.load(open('docs.json'))))") documentos"
          git pull --rebase origin main
          git push origin main
